<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>表示チェック</title>
<style>
:root{--bg:#1a1714;--fg:#f3ece3;--mu:#9a8f84;--ac:#e8742a}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.bar{position:sticky;top:0;z-index:2;width:100%;display:flex;gap:.5rem;justify-content:center;align-items:center;padding:.7rem;background:#0f0d0b;border-bottom:1px solid #2c2722}
.bar button{font:600 .85rem inherit;color:var(--fg);background:#2a2520;border:1px solid #3a332c;border-radius:999px;padding:.45rem 1rem;cursor:pointer}
.bar button[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:#fff}
.bar span{color:var(--mu);font-size:.8rem;margin-left:.6rem;min-width:7rem}
.stage{flex:1;width:100%;display:flex;justify-content:center;align-items:flex-start;padding:1.2rem;overflow:auto}
.frame{transform-origin:top center;border:1px solid #3a332c;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 1.5rem 4rem rgba(0,0,0,.5)}
iframe{display:block;border:0}
</style>
</head>
<body>
<div class="bar">
  <button data-w="1440" data-h="900">PC</button>
  <button data-w="1180" data-h="820" aria-pressed="true">iPad 横</button>
  <button data-w="820" data-h="1180">iPad 縦</button>
  <button data-w="390" data-h="844">スマホ</button>
  <span id="sz"></span>
</div>
<div class="stage"><div class="frame" id="f"><iframe id="ifr" src="index.html" allow="autoplay; screen-wake-lock"></iframe></div></div>
<script>
// 確認用。本番は E.html を直接開く
const f = document.getElementById('f'), ifr = document.getElementById('ifr'), sz = document.getElementById('sz');
let cur = {w:1180, h:820};
function fit(){
  const availW = window.innerWidth - 40, availH = window.innerHeight - 90;
  const s = Math.min(1, availW / cur.w, availH / cur.h);
  ifr.width = cur.w; ifr.height = cur.h;
  f.style.width = cur.w + 'px'; f.style.height = cur.h + 'px';
  f.style.transform = 'scale(' + s + ')';
  f.style.marginBottom = (cur.h * (s - 1)) + 'px';
  sz.textContent = cur.w + '×' + cur.h + (s < 1 ? '（' + Math.round(s * 100) + '%表示）' : '');
}
document.querySelectorAll('.bar button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.bar button').forEach(x => x.setAttribute('aria-pressed', x === b));
  cur = {w:+b.dataset.w, h:+b.dataset.h}; fit();
});
window.onresize = fit; fit();
</script>
</body>
</html>
